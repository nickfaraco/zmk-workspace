CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Enable mouse keys (required by the MSE layer)
CONFIG_ZMK_POINTING=y

# Store the OS layer (BASE or BASE_WIN) per endpoint. Wired boards need
# settings enabled explicitly (BLE boards get it implicitly).
CONFIG_SETTINGS=y
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=1
